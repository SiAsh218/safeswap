<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/styles/styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚄</text></svg>"
    />
    <title>Safe Swap</title>
  </head>
  <body>
    <header>
      <span style="text-align: center; width: 100%; display: block"
        >SAFE SWAP</span
      >
    </header>
    <main>
      <div
        style="
          display: flex;
          flex-direction: column;
          width: 100%;
          align-items: center;
          padding: 10px;
        "
      >
        <div
          style="
            display: block;
            width: 80%;
            max-width: 430px;
            background-color: white;
            padding: 15px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 15px;
          "
        >
          <span
            style="align-self: center; font-weight: bold"
            class="text--heading"
            >UPLOAD DIAGRAM TXT FILE</span
          >

          <div
            style="align-self: center"
            class="fileinput"
            id="fileinput--diagrams"
          >
            <div
              class="fileinput__button fileinput__button--select-file"
              id="fileinput__button--select-file"
            >
              <button class="button" style="width: 120px">Select File</button>
              <input
                type="file"
                accept=".txt"
                id="input__txt-diagrams"
                class="fileinput__input hidden"
              />
            </div>
            <label class="fileinput__label" for=""></label>
            <button
              style="opacity: 0; width: 120px"
              class="button fileinput__button fileinput__button--go"
              id="fileinput__button--go"
            >
              Upload
            </button>
          </div>
          <!-- Upload section -->

          <div
            style="
              display: flex;
              flex-direction: column;
              width: 100%;
              margin-top: 20px;
            "
            id="container--uploaded-files"
          >
            <span class="text--heading">UPLOADED FILES</span>
          </div>
        </div>

        <div
          style="
            display: block;
            width: 80%;
            max-width: 800px;
            min-width: 600px;
            background-color: white;
            padding: 15px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 15px;
          "
        >
          <div>
            <span class="text--heading">PARAMETERS</span>
            <div style="display: flex">
              <div style="padding: 2px; width: 50%">
                <label for="" class="text--form-heading">Date</label>
                <input
                  id="input--date"
                  value="2025-03-01"
                  type="date"
                  style="width: 250px"
                />
              </div>
              <div style="padding: 2px; width: 50%">
                <label for="" class="text--form-heading">Fleet</label>
                <select name="" id="input--fleet" style="width: 250px">
                  <option value="800/5">800/5</option>
                  <option value="802/5">802/5</option>
                  <option value="800/9">IET 9 Car</option>
                  <option value="150/2">150/2</option>
                  <option value="158/0">158/2</option>
                  <option value="158/9">158/3</option>
                  <option value="255/4">255/4</option>
                  <option value="165/2">165/2</option>
                  <option value="165/5">165/3 West</option>
                  <option value="165/3">165/3 LTV</option>
                  <option value="166/6">166/3</option>
                  <option value="387/1">387</option>
                </select>
              </div>
            </div>
            <div style="display: flex">
              <div style="width: 50%" class="my-toggle__wrapper">
                <label class="my-toggle" id="my-toggle--search-by">
                  <input
                    type="checkbox"
                    class="my-toggle__input"
                    id="my-toggle__input--search-by"
                  />
                  <span class="my-toggle__slider"></span>
                </label>
                <span class="my-toggle__label"
                  >Search by Start of Day Location</span
                >
              </div>
              <div style="width: 50%" class="my-toggle__wrapper hidden">
                <label class="my-toggle" id="my-toggle--swap-with">
                  <input
                    type="checkbox"
                    class="my-toggle__input"
                    id="my-toggle__input--swap-with"
                  />
                  <span class="my-toggle__slider"></span>
                </label>
                <span class="my-toggle__label"
                  >Swap by End of Day Location</span
                >
              </div>
            </div>
            <div style="display: flex">
              <div style="padding: 2px; width: 50%">
                <label
                  for=""
                  class="text--form-heading"
                  id="text--form-heading-start"
                  >Start of Day</label
                >
                <select name="" id="input--start" style="width: 250px">
                  <option value="NrthPlDpt">North Pole</option>
                  <option value="StkeGffrd">Stoke Gifford</option>
                  <option value="LairaTRMD">Laira</option>
                  <option value="Pznce TMD">Long Rock</option>
                  <option value="Exeter Tm">Exeter TMD</option>
                  <option value="SPM HST D">SPM</option>
                  <option value="Rdng  TCD">Reading TCD</option>
                  <option value="Swansea">Swansea</option>
                  <option value="Swansea M">Maliphant</option>
                  <option value="Penzance">Penzance</option>
                  <option value="OxfordUCS">Oxford UCS</option>
                  <option value="BristolTM">Bristol Temple Meads</option>
                  <option value="Btl Pkway">Bristol Parkway</option>
                  <option value="Hereford">Hereford</option>
                  <option value="Exeter NY">Exeter New Yard</option>
                  <option value="ExeterStD">Exeter St David's</option>
                  <option value="WorcHerSd">Worcester Hereford Sd</option>
                  <option value="EastlghFl">EastlghFl</option>
                  <option value="Paddingtn">Paddington</option>
                  <option value="Gloucestr">Gloucester</option>
                  <option value="GlosterCS">Gloucester CS</option>
                  <option value="PrChplSdg">Par Chapel Sd</option>
                  <option value="WestbryDS">Westbury DMU Sd</option>
                  <option value="SthmptonC">Southampton</option>
                  <option value="Fratton D">Fratton D</option>
                  <option value="Weymouth">Weymouth</option>
                  <option value="Jubilee S">Jubilee Sd</option>
                  <option value="Fareham">Fareham</option>
                  <option value="Twyford">Twyford</option>
                  <option value="BourneEnd">BourneEnd</option>
                  <option value="Rhill LS">Redhill LS</option>
                  <option value="Reading">Reading</option>
                  <option value="Cocklebur">Cocklebury</option>
                  <option value="WElngSdgs">West Ealing</option>
                </select>
                <select
                  name=""
                  id="input--headcodes"
                  class="hidden"
                  style="width: 250px"
                >
                  <!-- Rendered Dynamically -->
                </select>
              </div>
              <div style="padding: 2px; width: 50%">
                <label
                  for=""
                  id="text--form-heading-end"
                  class="text--form-heading"
                  >End of Day</label
                >
                <select name="" id="input--end" style="width: 250px">
                  <option value="NrthPlDpt">North Pole</option>
                  <option value="StkeGffrd">Stoke Gifford</option>
                  <option value="LairaTRMD">Laira</option>
                  <option value="Pznce TMD">Long Rock</option>
                  <option value="Exeter Tm">Exeter TMD</option>
                  <option value="SPM HST D">SPM</option>
                  <option value="Rdng  TCD">Reading TCD</option>
                  <option value="Swansea">Swansea</option>
                  <option value="Swansea M">Maliphant</option>
                  <option value="Penzance">Penzance</option>
                  <option value="OxfordUCS">Oxford UCS</option>
                  <option value="BristolTM">Bristol Temple Meads</option>
                  <option value="Btl Pkway">Bristol Parkway</option>
                  <option value="Hereford">Hereford</option>
                  <option value="Exeter NY">Exeter New Yard</option>
                  <option value="ExeterStD">Exeter St David's</option>
                  <option value="WorcHerSd">Worcester Hereford Sd</option>
                  <option value="EastlghFl">EastlghFl</option>
                  <option value="Paddingtn">Paddington</option>
                  <option value="Gloucestr">Gloucester</option>
                  <option value="GlosterCS">Gloucester CS</option>
                  <option value="PrChplSdg">Par Chapel Sd</option>
                  <option value="WestbryDS">Westbury DMU Sd</option>
                  <option value="SthmptonC">Southampton</option>
                  <option value="Fratton D">Fratton D</option>
                  <option value="Weymouth">Weymouth</option>
                  <option value="Jubilee S">Jubilee Sd</option>
                  <option value="Fareham">Fareham</option>
                  <option value="Twyford">Twyford</option>
                  <option value="BourneEnd">BourneEnd</option>
                  <option value="Rhill LS">Redhill LS</option>
                  <option value="Reading">Reading</option>
                  <option value="Cocklebur">Cocklebury</option>
                  <option value="WElngSdgs">West Ealing</option>
                </select>
                <select
                  name=""
                  id="input--headcodes-swap"
                  class="hidden"
                  style="width: 250px"
                >
                  <!-- Rendered Dynamically -->
                </select>
              </div>
            </div>
            <div style="padding: 2px">
              <div class="my-toggle__wrapper">
                <label class="my-toggle" id="my-toggle--cross-cover">
                  <input
                    type="checkbox"
                    class="my-toggle__input"
                    id="my-toggle__input--cross-cover"
                  />
                  <span class="my-toggle__slider"></span>
                </label>
                <span class="my-toggle__label">Cross Cover Disabled</span>
              </div>

              <div
                style="padding: 2px; display: flex; flex-direction: column"
                class="hidden"
                id="container--cross-cover-selections"
              >
                <label class="text--form-heading">Cross Cover Types</label>

                <div
                  style="
                    display: flex;
                    flex-wrap: wrap;
                    gap: 8px 16px; /* vertical then horizontal spacing */
                  "
                >
                  <label>
                    <input
                      type="checkbox"
                      class="checkbox--cross-cover"
                      value="800/5"
                    />
                    800/5
                  </label>

                  <label>
                    <input
                      type="checkbox"
                      class="checkbox--cross-cover"
                      value="802/5"
                    />
                    802/5
                  </label>

                  <label>
                    <input
                      type="checkbox"
                      class="checkbox--cross-cover"
                      value="800/9"
                    />
                    IET/9
                  </label>

                  <label>
                    <input
                      type="checkbox"
                      class="checkbox--cross-cover"
                      value="150/2"
                    />
                    150/2
                  </label>

                  <label>
                    <input
                      type="checkbox"
                      class="checkbox--cross-cover"
                      value="158/0"
                    />
                    158/2
                  </label>

                  <label>
                    <input
                      type="checkbox"
                      class="checkbox--cross-cover"
                      value="158/9"
                    />
                    158/3
                  </label>

                  <label>
                    <input
                      type="checkbox"
                      class="checkbox--cross-cover"
                      value="255/4"
                    />
                    255/4
                  </label>

                  <label>
                    <input
                      type="checkbox"
                      class="checkbox--cross-cover"
                      value="165/2"
                    />
                    165/2
                  </label>

                  <label>
                    <input
                      type="checkbox"
                      class="checkbox--cross-cover"
                      value="165/5"
                    />
                    165/3 West
                  </label>

                  <label>
                    <input
                      type="checkbox"
                      class="checkbox--cross-cover"
                      value="165/3"
                    />
                    165/3 LTV
                  </label>

                  <label>
                    <input
                      type="checkbox"
                      class="checkbox--cross-cover"
                      value="387/1"
                    />
                    387
                  </label>

                  <label>
                    <input
                      type="checkbox"
                      class="checkbox--cross-cover"
                      value="166/6"
                    />
                    166/3
                  </label>
                </div>
              </div>
            </div>
            <div
              style="padding: 2px; display: flex; flex-direction: column"
              id="container--swap-locations"
            >
              <label class="text--form-heading">Swap Locations</label>

              <div
                style="
                  padding: 2px;
                  display: flex;
                  flex-wrap: wrap;
                  gap: 8px 16px; /* 8px vertical, 16px horizontal spacing */
                "
              >
                <label>
                  <input
                    type="checkbox"
                    class="checkbox--swap-location"
                    value="Paddingtn"
                    checked
                    style="margin-right: 5px"
                  />Paddington
                </label>

                <label>
                  <input
                    type="checkbox"
                    class="checkbox--swap-location"
                    value="BristolTM"
                    checked
                  />
                  Bristol TM
                </label>

                <label>
                  <input
                    type="checkbox"
                    class="checkbox--swap-location"
                    value="Btl Pkway"
                    checked
                  />
                  Bristol Parkway
                </label>

                <label>
                  <input
                    type="checkbox"
                    class="checkbox--swap-location"
                    value="Swansea"
                    checked
                  />
                  Swansea
                </label>

                <label>
                  <input
                    type="checkbox"
                    class="checkbox--swap-location"
                    value="Paignton"
                    checked
                  />
                  Paignton
                </label>

                <label>
                  <input
                    type="checkbox"
                    class="checkbox--swap-location"
                    value="Plymouth"
                    checked
                  />
                  Plymouth
                </label>

                <label>
                  <input
                    type="checkbox"
                    class="checkbox--swap-location"
                    value="Gloucestr"
                    checked
                  />
                  Gloucester
                </label>

                <label>
                  <input
                    type="checkbox"
                    class="checkbox--swap-location"
                    value="WestburyE"
                    checked
                  />
                  Westbury
                </label>

                <label>
                  <input
                    type="checkbox"
                    class="checkbox--swap-location"
                    value="Penzance"
                    checked
                  />
                  Penzance
                </label>

                <label>
                  <input
                    type="checkbox"
                    class="checkbox--swap-location"
                    value="ExeterStD"
                    checked
                  />
                  Exeter St D
                </label>

                <label>
                  <input
                    type="checkbox"
                    class="checkbox--swap-location"
                    value="Oxford"
                    checked
                  />
                  Oxford
                </label>

                <label>
                  <input
                    type="checkbox"
                    class="checkbox--swap-location"
                    value="Reading"
                    checked
                  />
                  Reading
                </label>

                <label>
                  <input
                    type="checkbox"
                    class="checkbox--swap-location"
                    value="Taunton"
                    checked
                  />
                  Taunton
                </label>

                <label>
                  <input
                    type="checkbox"
                    class="checkbox--swap-location"
                    value="Cardiff C"
                    checked
                  />
                  Cardiff C
                </label>
              </div>
            </div>

            <div style="padding: 2px">
              <div class="my-toggle__wrapper">
                <label class="my-toggle" id="my-toggle--start-of-day">
                  <input
                    type="checkbox"
                    class="my-toggle__input"
                    checked
                    id="my-toggle__input--start-of-day"
                  />
                  <span class="my-toggle__slider"></span>
                </label>
                <span class="my-toggle__label"
                  >Include swap options where trains start at the same
                  location</span
                >
              </div>
            </div>
          </div>
          <div style="display: flex; justify-content: center">
            <button id="button--go" class="button" style="margin: 5px">
              Go
            </button>
          </div>
        </div>
      </div>

      <div
        id="container--result"
        style="
          display: flex;
          flex-direction: column;
          margin: 0 10px;
          max-width: 100%;
          background-color: white;
          padding: 15px;
          border-radius: var(--radius);
          box-shadow: var(--shadow);
          margin-bottom: 15px;
        "
        class="hidden"
      ></div>
      <div
        id="container--result-three-trains"
        style="
          display: flex;
          flex-direction: column;
          margin: 0 10px;
          max-width: 100%;
          background-color: white;
          padding: 15px;
          border-radius: var(--radius);
          box-shadow: var(--shadow);
          margin-bottom: 15px;
        "
        class="hidden"
      ></div>
    </main>
    <!-- <footer></footer> -->
    <script src="../../dist/bundle.js" type="module"></script>
  </body>
</html>
